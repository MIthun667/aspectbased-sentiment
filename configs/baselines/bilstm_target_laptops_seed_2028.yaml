schema_version: "1.0"

description: >
  Target-marked bidirectional LSTM baseline trained and evaluated
  on the protected Laptop domain splits.

model:
  name: target_aware_bilstm
  parameters:
    minimum_frequency: 2
    maximum_length: 128
    embedding_dimension: 128
    hidden_dimension: 128
    number_of_layers: 1
    dropout: 0.3
    gradient_clip_norm: 1.0
    class_weighting: false
    num_workers: 0

data:
  processed_root: data/processed
  train_domain: laptops
  evaluation_domains:
    - laptops

training:
  seed: 2028
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  selection_metric: macro_f1
  maximize_selection_metric: true

evaluation:
  batch_size: 64
  save_probabilities: true
  save_predictions: true
  duplicate_excluded_sensitivity: true

output:
  root: artifacts/experiments
  experiment_name: bilstm_target_laptops
  overwrite: false
