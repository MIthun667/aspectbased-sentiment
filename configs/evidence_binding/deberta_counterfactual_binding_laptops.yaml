schema_version: "1.0"

description: >
  DeBERTa-v3-base counterfactual target-evidence binding classifier.
  The model uses an explicit scalar compatibility score between the
  target and selected weak evidence. During training, selected evidence
  is contrasted against deterministic random same-sentence and shuffled
  cross-instance evidence views. Validation and testing use only the
  selected weak-evidence view.

model:
  name: counterfactual_binding_deberta
  parameters:
    model_name_or_path: microsoft/deberta-v3-base
    evidence_root: data/derived/evidence
    maximum_length: 128
    reject_truncation: true

    dropout: 0.1
    compatibility_dimension: 256

    combined_weight: 1.0
    context_weight: 0.2
    evidence_weight: 0.5
    agreement_weight: 0.1
    agreement_temperature: 1.0

    ranking_weight: 0.2
    probability_margin_weight: 0.2
    ranking_margin: 0.2
    probability_margin: 0.05
    counterfactual_seed: 2026

    gradient_clip_norm: 1.0
    warmup_ratio: 0.1
    class_weighting: false
    use_bfloat16: false
    local_files_only: true
    num_workers: 0

data:
  processed_root: data/processed
  train_domain: laptops
  evaluation_domains:
    - laptops

training:
  seed: 2026
  epochs: 8
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  early_stopping_patience: 3
  selection_metric: macro_f1
  maximize_selection_metric: true

evaluation:
  batch_size: 32
  save_probabilities: true
  save_predictions: true
  duplicate_excluded_sensitivity: true

output:
  root: artifacts/experiments
  experiment_name: counterfactual_binding_deberta_laptops
  overwrite: false
