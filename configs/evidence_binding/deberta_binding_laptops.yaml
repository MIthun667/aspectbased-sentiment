schema_version: "1.0"

description: >
  DeBERTa-v3-base evidence-binding classifier with separate context,
  evidence-only, and gated combined prediction heads. The model is trained
  with combined classification, context classification, evidence-only
  classification, and prediction-agreement objectives.

model:
  name: evidence_binding_deberta
  parameters:
    model_name_or_path: microsoft/deberta-v3-base
    evidence_root: data/derived/evidence
    maximum_length: 128
    reject_truncation: true

    dropout: 0.1
    gate_dimension: 256

    combined_weight: 1.0
    context_weight: 0.2
    evidence_weight: 0.5
    agreement_weight: 0.1
    agreement_temperature: 1.0

    gradient_clip_norm: 1.0
    warmup_ratio: 0.1
    class_weighting: false
    use_bfloat16: false
    local_files_only: true
    num_workers: 0

data:
  processed_root: data/processed
  train_domain: laptops
  evaluation_domains:
    - laptops

training:
  seed: 2026
  epochs: 8
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  early_stopping_patience: 3
  selection_metric: macro_f1
  maximize_selection_metric: true

evaluation:
  batch_size: 32
  save_probabilities: true
  save_predictions: true
  duplicate_excluded_sensitivity: true

output:
  root: artifacts/experiments
  experiment_name: evidence_binding_deberta_laptops
  overwrite: false
